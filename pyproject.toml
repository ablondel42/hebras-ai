[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hedras-ai"
version = "0.1.0"
description = "Full-stack AI Python project with NVIDIA Nemotron integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "llama-index>=0.10.0",
    "llama-index-llms-nvidia>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "components*", "data*", "providers*", "prompts*", "scripts*", "security*", "tests*"]